<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar Exam</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#5d6577;--ac:#4f46e5;--ok:#15803d;--bad:#b91c1c;--bd:#dfe2ec}
@media (prefers-color-scheme:dark){:root{--bg:#12141b;--card:#1c1f2a;--tx:#e8eaf2;--mu:#9aa2b6;--ac:#8b86ff;--ok:#4ade80;--bad:#f87171;--bd:#2d3243}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:8px 0 4px}h2{font-size:1.1rem}
.sub{color:var(--mu);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input[type=text],input[type=email],input[type=password]{width:100%;padding:12px;font-size:1rem;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin-bottom:8px}
button{font:inherit;border:0;border-radius:10px;padding:12px 18px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer;width:100%;margin-top:6px}
button.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.q{font-weight:600;margin:0 0 8px}.q span{color:var(--mu);font-weight:500}
label.o{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--bd);border-radius:10px;margin-top:6px;cursor:pointer}
label.sel{border-color:var(--ac)}
label.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
label.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;font-size:.9rem;color:var(--mu)}
.big{font-size:2.4rem;font-weight:800;text-align:center;margin:4px 0}
.hide{display:none}.err{color:var(--bad)}.ok-t{color:var(--ok)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
tr.row{cursor:pointer}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.82rem;font-weight:600}
.good{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.weak{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.mid{background:color-mix(in srgb,#d97706 22%,transparent);color:#d97706}
.det{white-space:normal;font-size:.9rem;color:var(--mu)}
</style>
</head>
<body>
<main>

<!-- ================= STUDENT ================= -->
<div id="student">
<h1>English Grammar Exam</h1>
<p class="sub" id="sub"></p>
<section id="start" class="card">
  <label for="nm">Your full name</label>
  <input id="nm" type="text" maxlength="60" placeholder="Type your name" autocomplete="name">
  <p id="nmErr" class="err hide">Please type your name first.</p>
  <button id="go">Start exam</button>
</section>
<section id="exam" class="hide">
  <div class="bar" id="bar"></div>
  <div id="qs"></div>
  <button id="submit">Submit exam</button>
  <p id="subErr" class="err hide"></p>
</section>
<section id="res" class="hide">
  <div class="card">
    <div class="big" id="score"></div>
    <p class="sub" id="pct" style="text-align:center"></p>
    <p id="saved" class="sub" style="text-align:center"></p>
    <div id="fallback" class="hide">
      <p class="err">Your result could not be sent automatically. Copy this message and send it to your teacher:</p>
      <textarea id="msg" readonly style="width:100%;min-height:90px"></textarea>
    </div>
  </div>
  <h2>Review your answers</h2>
  <div id="rev"></div>
</section>
</div>

<!-- ================= TEACHER ================= -->
<div id="teacher" class="hide">
<h1>Teacher dashboard</h1>
<section id="login" class="card">
  <input id="em" type="email" placeholder="Teacher email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="li">Log in</button>
  <p id="liErr" class="err hide"></p>
</section>
<section id="dash" class="hide">
  <div class="card" id="summary"></div>
  <div class="card"><h2 style="margin-top:0">Class strengths &amp; weaknesses</h2><div id="topics"></div></div>
  <div class="card"><h2 style="margin-top:0">Most-missed questions</h2><div id="hard"></div></div>
  <div class="card"><h2 style="margin-top:0">Students <span class="sub">(tap a row for details)</span></h2>
    <div class="scroll"><table id="tbl"></table></div>
    <button id="csv" class="alt">Download CSV</button>
    <button id="out" class="alt">Log out</button>
  </div>
</section>
</div>

</main>

var LV=["E", "E", "E", "E", "E", "E", "E", "E", "E", "E", "M", "M", "M", "M", "M", "M", "M", "M", "M", "M", "H", "H", "H", "H", "H", "H", "H", "H", "H", "H", "E", "E", "E", "E", "E", "E", "E", "E", "E", "E", "M", "M", "M", "M", "M", "M", "M", "M", "M", "M", "H", "H", "H", "H", "H", "H", "H", "H", "H", "H", "E", "E", "E", "E", "E", "E", "E", "E", "E", "E", "M", "M", "M", "M", "M", "M", "M", "M", "M", "M", "H", "H", "H", "H", "H", "H", "H", "H", "H", "H", "E", "E", "E", "E", "E", "E", "E", "E", "E", "E", "M", "M", "M", "M", "M", "M", "M", "M", "M", "M", "H", "H", "H", "H", "H", "H", "H", "H", "H", "H", "E", "E", "E", "E", "E", "E", "E", "E", "E", "E", "M", "M", "M", "M", "M", "M", "M", "M", "M", "M", "H", "H", "H", "H", "H", "H", "H", "H", "H", "H"];

var $=function(i){return document.getElementById(i)};
var esc=function(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var sb=null;
try{if(SUPABASE_URL.indexOf("http")===0)sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function cls(p){return p>=STRONG?"good":(p<WEAK?"weak":"mid")}

// ---------- routing: add #teacher to the link for the dashboard ----------
function route(){var t=location.hash==="#teacher";$("student").classList.toggle("hide",t);$("teacher").classList.toggle("hide",!t);if(t)initTeacher()}
window.addEventListener("hashchange",route);route();

// ---------- STUDENT ----------
var PER_GROUP=3; // questions per topic per level. 3 = 45 questions per student, 10 = all 150
var LVN={E:"Easy",M:"Medium",H:"Difficult"};
var pool={};Q.forEach(function(q,i){var k=q[0]+"|"+LV[i];(pool[k]=pool[k]||[]).push(i)});
var chosen=[];Object.keys(pool).forEach(function(k){chosen=chosen.concat(shuf(pool[k]).slice(0,PER_GROUP))});
chosen=shuf(chosen).sort(function(a,b){return "EMH".indexOf(LV[a])-"EMH".indexOf(LV[b])});
var S=chosen.map(function(i){var q=Q[i];return {i:i,topic:q[0],lv:LV[i],q:q[1],ans:q[2],opts:shuf(q.slice(2)),pick:null}});
$("sub").textContent="Grammar exam · "+S.length+" multiple-choice questions · easy to difficult";
var name="";
function render(){
  var h="";
  S.forEach(function(s,i){
    h+='<div class="card" id="c'+i+'"><p class="q"><span>'+(i+1)+'/'+S.length+'</span> '+esc(s.q)+'</p>';
    s.opts.forEach(function(o,k){h+='<label class="o"><input type="radio" name="q'+i+'" value="'+k+'"> <span>'+esc(o)+'</span></label>'});
    h+='</div>';
  });
  $("qs").innerHTML=h;
  $("qs").addEventListener("change",function(e){
    var m=/^q(\d+)$/.exec(e.target.name||"");if(!m)return;
    var i=+m[1];S[i].pick=+e.target.value;
    var ls=document.querySelectorAll("#c"+i+" label");
    for(var k=0;k<ls.length;k++)ls[k].className="o"+(k===S[i].pick?" sel":"");
    bar();
  });
  bar();
}
function bar(){var n=S.filter(function(s){return s.pick!==null}).length;$("bar").textContent=name+" · Answered "+n+" of "+S.length}
$("go").onclick=function(){
  var v=$("nm").value.trim();
  if(!v){$("nmErr").classList.remove("hide");return}
  name=v;$("start").classList.add("hide");$("exam").classList.remove("hide");render();window.scrollTo(0,0);
};
var warned=false,sent=false;
$("submit").onclick=function(){
  var miss=[];S.forEach(function(s,i){if(s.pick===null)miss.push(i+1)});
  if(miss.length&&!warned){
    warned=true;
    $("subErr").textContent="You left "+miss.length+" unanswered (Q"+miss.slice(0,8).join(", Q")+(miss.length>8?"…":"")+"). Tap Submit again to finish anyway.";
    $("subErr").classList.remove("hide");return;
  }
  finish();
};
function finish(){
  if(sent)return;sent=true;
  var sc=0,ts={},ans=[];
  S.forEach(function(s){
    var ok=s.pick!==null&&s.opts[s.pick]===s.ans;if(ok)sc++;
    ts[s.topic]=ts[s.topic]||{c:0,t:0};ts[s.topic].t++;if(ok)ts[s.topic].c++;
    ans.push({i:s.i,ok:ok,p:s.pick===null?null:s.opts[s.pick]});
  });
  var pc=Math.round(sc/S.length*100);
  $("score").textContent=sc+" / "+S.length;$("pct").textContent=pc+"%";
  var wrong=[];S.forEach(function(s,k){if(!(s.pick!==null&&s.opts[s.pick]===s.ans))wrong.push(k+1)});
  var lines=Object.keys(ts).map(function(k){return k+": "+ts[k].c+"/"+ts[k].t});
  $("msg").value=TITLE+"\nName: "+name+"\nScore: "+sc+"/"+S.length+" ("+pc+"%)\n"+lines.join("\n")+(wrong.length?"\nWrong/unanswered: Q"+wrong.join(", Q"):"");
  var rv="";
  S.forEach(function(s,i){
    rv+='<div class="card"><p class="q"><span>'+(i+1)+'.</span> '+esc(s.q)+'</p>';
    s.opts.forEach(function(o,k){
      var c=o===s.ans?"ok":(k===s.pick?"no":"");
      rv+='<label class="o '+c+'"><span>'+esc(o)+(o===s.ans?" ✓":(k===s.pick?" ✗":""))+'</span></label>';
    });
    if(s.pick===null)rv+='<p class="err">Not answered</p>';
    rv+='</div>';
  });
  $("rev").innerHTML=rv;
  $("exam").classList.add("hide");$("res").classList.remove("hide");window.scrollTo(0,0);
  $("saved").textContent="Sending your result to your teacher…";
  if(!sb){return fail()}
  sb.from("exam_results").insert({student_name:name,score:sc,total:S.length,topic_scores:ts,answers:ans}).then(function(r){
    if(r.error)return fail();
    $("saved").innerHTML='<span class="ok-t">✓ Your result was sent to your teacher.</span>';
  },fail);
}
function fail(){$("saved").textContent="";$("fallback").classList.remove("hide")}

// ---------- TEACHER ----------
var rows=[],tInit=false;
function initTeacher(){
  if(tInit)return;tInit=true;
  if(!sb){$("liErr").textContent="Supabase is not set up yet. Paste your URL and key at the top of the script.";$("liErr").classList.remove("hide");return}
  sb.auth.getSession().then(function(r){if(r.data&&r.data.session)load()});
  $("li").onclick=function(){
    sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value}).then(function(r){
      if(r.error){$("liErr").textContent="Login failed: "+r.error.message;$("liErr").classList.remove("hide")}else load();
    });
  };
  $("out").onclick=function(){sb.auth.signOut().then(function(){location.reload()})};
  $("csv").onclick=csv;
}
function load(){
  sb.from("exam_results").select("*").order("created_at",{ascending:false}).then(function(r){
    if(r.error){$("liErr").textContent="Could not load results: "+r.error.message;$("liErr").classList.remove("hide");return}
    rows=r.data||[];$("login").classList.add("hide");$("dash").classList.remove("hide");draw();
  });
}
function pct(c,t){return t?Math.round(c/t*100):0}
function draw(){
  var n=rows.length,avg=n?Math.round(rows.reduce(function(a,x){return a+pct(x.score,x.total)},0)/n):0;
  $("summary").innerHTML='<strong>'+n+'</strong> student'+(n===1?'':'s')+' took the exam · class average <strong>'+avg+'%</strong>';
  // topics
  var T={};rows.forEach(function(x){Object.keys(x.topic_scores||{}).forEach(function(k){var v=x.topic_scores[k];T[k]=T[k]||{c:0,t:0};T[k].c+=v.c;T[k].t+=v.t})});
  $("topics").innerHTML=Object.keys(T).map(function(k){var p=pct(T[k].c,T[k].t);return '<p><span class="pill '+cls(p)+'">'+p+'%</span> '+esc(k)+(p<WEAK?' — <strong>reteach this</strong>':'')+'</p>'}).join("")||'<p class="sub">No results yet.</p>';
  // hardest
  var M={};rows.forEach(function(x){(x.answers||[]).forEach(function(a){M[a.i]=M[a.i]||{w:0,t:0};M[a.i].t++;if(!a.ok)M[a.i].w++})});
  var hard=Object.keys(M).map(function(i){return {i:+i,w:M[i].w,t:M[i].t}}).sort(function(a,b){return b.w/b.t-a.w/a.t}).slice(0,5);
  $("hard").innerHTML=hard.map(function(h){return '<p><span class="pill weak">'+pct(h.w,h.t)+'% missed</span> Q'+(h.i+1)+': '+esc(Q[h.i][1])+' <span class="sub">('+esc(Q[h.i][0])+', '+LVN[LV[h.i]]+')</span></p>'}).join("")||'<p class="sub">No results yet.</p>';
  // table
  var th='<tr><th>Name</th><th>Score</th><th>%</th><th>Weakest topic</th><th>Time</th></tr>';
  $("tbl").innerHTML=th+rows.map(function(x,k){
    var p=pct(x.score,x.total),ts=x.topic_scores||{},wk="",wp=101;
    Object.keys(ts).forEach(function(t){var q=pct(ts[t].c,ts[t].t);if(q<wp){wp=q;wk=t}});
    return '<tr class="row" data-k="'+k+'"><td>'+esc(x.student_name)+'</td><td>'+x.score+'/'+x.total+'</td><td><span class="pill '+cls(p)+'">'+p+'%</span></td><td>'+(wk?esc(wk)+' ('+wp+'%)':'-')+'</td><td>'+new Date(x.created_at).toLocaleString()+'</td></tr><tr class="hide" id="d'+k+'"><td colspan="5" class="det"></td></tr>';
  }).join("");
  $("tbl").onclick=function(e){
    var tr=e.target.closest("tr.row");if(!tr)return;
    var k=tr.dataset.k,d=$("d"+k);
    if(d.classList.contains("hide")){
      var x=rows[k],ts=x.topic_scores||{};
      var h=Object.keys(ts).map(function(t){var p=pct(ts[t].c,ts[t].t);return '<span class="pill '+cls(p)+'">'+p+'%</span> '+esc(t)+' ('+ts[t].c+'/'+ts[t].t+')'}).join("<br>");
      var w=(x.answers||[]).filter(function(a){return !a.ok}).map(function(a){return '<br>Q'+(a.i+1)+': '+esc(Q[a.i][1])+' → chose “'+esc(a.p===null?"no answer":a.p)+'”, correct: “'+esc(Q[a.i][2])+'”'}).join("");
      d.firstChild.innerHTML=h+'<br><br><strong>Mistakes:</strong>'+(w||' none')+'';
      d.classList.remove("hide");
    }else d.classList.add("hide");
  };
}
function csv(){
  var tp=Object.keys(rows.reduce(function(a,x){Object.keys(x.topic_scores||{}).forEach(function(k){a[k]=1});return a},{}));
  var out=[["Name","Score","Total","Percent"].concat(tp.map(function(t){return t+" %"})).concat(["Time"])];
  rows.forEach(function(x){out.push([x.student_name,x.score,x.total,pct(x.score,x.total)].concat(tp.map(function(t){var v=(x.topic_scores||{})[t];return v?pct(v.c,v.t):""})).concat([x.created_at]))});
  var s=out.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv"}));a.download="exam-results.csv";a.click();
}
</script>
</body>
</html>
